# Read aliases for the beads cookbook (graph `beads`).
# Merge the `aliases:` entries below into $OMNIGRAPH_HOME/config.yaml, the operator
# config from ../README.md#local-setup, whose `local-reader` target they use.
# Run one with `omnigraph alias <name>`; pass a query's parameters by name with
# `--params '{"id":"..."}'`. Aliases only read; run stored mutations with
# `omnigraph mutate <name> --target local-writer --graph beads --params '{...}'`
# (see the bottom), or use the `ob` client in client/, which also retries lost
# races for you.
aliases:
  # ── Work state (derived on every read) ───────────────────────
  ready:          {target: local-reader, graph: beads, query: ready}
  ready-label:    {target: local-reader, graph: beads, query: ready_labeled}        # --params '{"label":"..."}'
  ready-count:    {target: local-reader, graph: beads, query: ready_count}
  blocked:        {target: local-reader, graph: beads, query: blocked}
  blocked-parent: {target: local-reader, graph: beads, query: blocked_by_ancestor}
  mine:           {target: local-reader, graph: beads, query: assigned}             # --params '{"who":"..."}'
  expired:        {target: local-reader, graph: beads, query: expired_leases}
  stats:          {target: local-reader, graph: beads, query: stats}

  # ── One issue ────────────────────────────────────────────────
  issue:          {target: local-reader, graph: beads, query: show}                 # --params '{"id":"..."}'
  waits-on:       {target: local-reader, graph: beads, query: out_links}            # --params '{"id":"..."}'
  waited-on-by:   {target: local-reader, graph: beads, query: in_links}             # --params '{"id":"..."}'
  inherited:      {target: local-reader, graph: beads, query: ancestor_blockers}    # --params '{"id":"..."}'
  children:       {target: local-reader, graph: beads, query: children}             # --params '{"id":"..."}'
  upstream:       {target: local-reader, graph: beads, query: upstream}             # --params '{"id":"..."}'
  downstream:     {target: local-reader, graph: beads, query: downstream}           # --params '{"id":"..."}'
  comments:       {target: local-reader, graph: beads, query: comments}             # --params '{"id":"..."}'
  issue-memories: {target: local-reader, graph: beads, query: memories_about}       # --params '{"id":"..."}'

  # ── Search and memory ────────────────────────────────────────
  search:         {target: local-reader, graph: beads, query: search}               # --params '{"q":"..."}'
  memories:       {target: local-reader, graph: beads, query: memories}
  recall:         {target: local-reader, graph: beads, query: recall}               # --params '{"q":"..."}'
  # Semantic (needs an embedding provider + stored vectors; see README):
  similar:        {target: local-reader, graph: beads, query: similar}              # --params '{"q":"..."}'
  recall-meaning: {target: local-reader, graph: beads, query: recall_semantic}      # --params '{"q":"..."}'

# ── Mutations (served stored mutations; NOT aliasable) ───────────────────────
# The target's token determines authorization and commit attribution; $who is
# application provenance stored in the row, not authority. A write that loses
# the race for the branch head is refused before any effect (read_set_conflict,
# with `effects: none`): rerun it. Every mutation here re-checks its own
# condition, so a rerun cannot apply twice. Examples:
#   omnigraph mutate claim --target local-writer --graph beads \
#     --params '{"id":"lk-acl","who":"act-writer","lease":null}'   # or a future UTC time
#   omnigraph mutate close --target local-writer --graph beads \
#     --params '{"ids":["lk-acl"],"reason":"ACLs enforced server-side","never":null}'
#   omnigraph mutate link_blocks --target local-writer --graph beads \
#     --params '{"src":"lk-search","dst":"lk-acl"}'
