# Read aliases for the binder-campaign cookbook (graph `binders`).
# Merge the `aliases:` entries below into $OMNIGRAPH_HOME/config.yaml, the operator
# config from ../docs/local-setup.md, whose `local-reader` target they use.
# Run one with `omnigraph alias <name>`; pass a query's parameters by name with
# `--params '{"criterion":"..."}'`. Aliases only read; run stored mutations with
# `omnigraph mutate <name> --target local-writer --graph binders --params '{...}'`,
# on a review branch with `--branch <your branch>`.
aliases:

  # ── Claims: what the campaign says it found, and what that rests on ──
  claims:              {target: local-reader, graph: binders, query: binder_claims}
  claim-evidence:      {target: local-reader, graph: binders, query: claim_evidence}   # --params '{"claim":"claim:cn2-b1-cn2"}'
  criteria:            {target: local-reader, graph: binders, query: criteria_all}
  criterion-counts:    {target: local-reader, graph: binders, query: criterion_survivor_counts}
  survives:            {target: local-reader, graph: binders, query: claims_under_criterion}   # --params '{"criterion":"crit:kd-within-tenfold"}'
  lost-under:          {target: local-reader, graph: binders, query: claims_lost_under}   # --params '{"criterion":"crit:kd-within-tenfold"}'
  claims-with-gaps:    {target: local-reader, graph: binders, query: claims_with_gaps}
  gaps:                {target: local-reader, graph: binders, query: evidence_gaps}
  gap-reach:           {target: local-reader, graph: binders, query: gap_reach}
  solid-claims:        {target: local-reader, graph: binders, query: claims_fully_evidenced}

  # ── Designs, and how each was made ───────────────────────────────────
  design:              {target: local-reader, graph: binders, query: get_design}   # --params '{"slug":"design:888c8f04"}'
  design-provenance:   {target: local-reader, graph: binders, query: design_provenance}   # --params '{"slug":"design:888c8f04"}'
  design-lineage:      {target: local-reader, graph: binders, query: design_lineage}   # --params '{"slug":"design:3a62f8c7"}'
  fusion-domains:      {target: local-reader, graph: binders, query: fusion_domains}   # --params '{"slug":"design:aa310a28"}'
  designs-by-tool:     {target: local-reader, graph: binders, query: designs_by_tool}   # --params '{"tool":"tool:rfdiffusion3"}'
  tools-behind-binders: {target: local-reader, graph: binders, query: tools_behind_binders}
  added-after:         {target: local-reader, graph: binders, query: designs_added_after}
  design-targets:      {target: local-reader, graph: binders, query: design_targets}   # --params '{"slug":"design:888c8f04"}'
  multi-target:        {target: local-reader, graph: binders, query: multi_target_designs}

  # ── Scores and the bars they were judged against ─────────────────────
  thresholds:          {target: local-reader, graph: binders, query: thresholds_all}
  design-scores:       {target: local-reader, graph: binders, query: design_scores}   # --params '{"slug":"design:888c8f04"}'
  score-behind-claim:  {target: local-reader, graph: binders, query: score_behind_claim}   # --params '{"claim":"claim:cn2-b1-cn2"}'
  top-scores:          {target: local-reader, graph: binders, query: top_scores}   # --params '{"target":"target:cn2"}'
  rerun-scores:        {target: local-reader, graph: binders, query: scores_from_rerun}
  cleared:             {target: local-reader, graph: binders, query: cleared_against}   # --params '{"target":"target:cn2"}'
  cleared-but-missed:  {target: local-reader, graph: binders, query: cleared_but_did_not_bind}   # --params '{"target":"target:cn2"}'

  # ── What the labs measured ───────────────────────────────────────────
  measurements:        {target: local-reader, graph: binders, query: measurements_for_design}   # --params '{"slug":"design:888c8f04"}'
  lab-disagreements:   {target: local-reader, graph: binders, query: lab_disagreements}
  upper-limits:        {target: local-reader, graph: binders, query: upper_limit_only}
  off-target:          {target: local-reader, graph: binders, query: off_target_hits}
  specificity:         {target: local-reader, graph: binders, query: specificity_for_design}   # --params '{"slug":"design:888c8f04"}'
  controls:            {target: local-reader, graph: binders, query: controls_for_target}   # --params '{"target":"target:cn2"}'
  failed-controls:     {target: local-reader, graph: binders, query: failed_controls}
  tightest:            {target: local-reader, graph: binders, query: tightest_binding}

  # ── The campaign as a process ────────────────────────────────────────
  windows:             {target: local-reader, graph: binders, query: campaign_windows}
  selection-rules:     {target: local-reader, graph: binders, query: selection_rules}
  rules-that-replaced: {target: local-reader, graph: binders, query: rules_that_replaced}
  agent-roles:         {target: local-reader, graph: binders, query: agent_roles}
  sources:             {target: local-reader, graph: binders, query: sources}
  uncited-gaps:        {target: local-reader, graph: binders, query: uncited_gaps}
  targets:             {target: local-reader, graph: binders, query: targets}
  hotspots:            {target: local-reader, graph: binders, query: hotspots}   # --params '{"target":"target:cn2"}'
  claims-by-target:    {target: local-reader, graph: binders, query: claims_by_target}
