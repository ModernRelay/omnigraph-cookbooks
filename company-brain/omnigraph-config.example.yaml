# Read aliases for the company-brain cookbook (graph `company`).
# Merge the `aliases:` entries below into $OMNIGRAPH_HOME/config.yaml, the operator
# config from ../README.md#local-setup, whose `local-reader` target they use.
# Run one with `omnigraph alias <name>`; pass a query's parameters by name with
# `--params '{"slug":"..."}'`. Aliases only read; run stored mutations with
# `omnigraph mutate <name> --target local-writer --graph company --params '{...}'`.
# An alias always reads main: it cannot choose a branch. To read an agent's
# branch, run the stored query by name instead:
#   omnigraph query decisions_at_risk --target local-reader --graph company --branch agent/notes-oct-14
aliases:
  # ── Decisions ────────────────────────────────────────────────
  decisions:        {target: local-reader, graph: company, query: current_decisions}
  project:          {target: local-reader, graph: company, query: project_decisions}            # --params '{"project":"..."}'
  why:              {target: local-reader, graph: company, query: decision_evidence}            # --params '{"decision":"..."}'
  why-replaced:     {target: local-reader, graph: company, query: why_superseded}               # --params '{"decision":"..."}'
  why-contradicted: {target: local-reader, graph: company, query: superseding_contradictions}   # --params '{"decision":"..."}'
  who-decided:      {target: local-reader, graph: company, query: decision_deciders}            # --params '{"decision":"..."}'
  lineage:          {target: local-reader, graph: company, query: decision_lineage}             # --params '{"decision":"..."}'
  replaced-by:      {target: local-reader, graph: company, query: decision_successor}           # --params '{"decision":"..."}'
  from-source:      {target: local-reader, graph: company, query: decisions_from_source}        # --params '{"source":"..."}'
  to-review:        {target: local-reader, graph: company, query: proposed_decisions}
  not-started:      {target: local-reader, graph: company, query: unimplemented_decisions}

  # ── Claims ───────────────────────────────────────────────────
  claims:           {target: local-reader, graph: company, query: claims_from_source}   # --params '{"source":"..."}'
  contested:        {target: local-reader, graph: company, query: contested_claims}
  at-risk:          {target: local-reader, graph: company, query: decisions_at_risk}
  to-verify:        {target: local-reader, graph: company, query: unverified_claims}
  who-said:         {target: local-reader, graph: company, query: search_quotes}        # --params '{"q":"..."}'

  # ── Commitments ──────────────────────────────────────────────
  open:             {target: local-reader, graph: company, query: open_actions}
  overdue:          {target: local-reader, graph: company, query: overdue_actions}   # --params '{"as_of":"..."}'
  owes:             {target: local-reader, graph: company, query: person_actions}    # --params '{"person":"..."}'

  # ── People, projects, evidence ───────────────────────────────
  team:             {target: local-reader, graph: company, query: team_members}       # --params '{"team":"..."}'
  whois:            {target: local-reader, graph: company, query: person_by_handle}   # --params '{"handle":"..."}'
  actors:           {target: local-reader, graph: company, query: actors}
  projects:         {target: local-reader, graph: company, query: active_projects}
  quiet:            {target: local-reader, graph: company, query: quiet_projects}     # --params '{"since":"..."}'
  sources:          {target: local-reader, graph: company, query: project_sources}    # --params '{"project":"..."}'

  # ── Hygiene on main (zero rows on a healthy graph) ───────────
  # Check a branch before merging it with `omnigraph query <name> --branch …`.
  lint-unsupported: {target: local-reader, graph: company, query: unsupported_decisions}
  lint-unverified:  {target: local-reader, graph: company, query: accepted_on_unverified}
  lint-on-rejected: {target: local-reader, graph: company, query: current_on_rejected}
  lint-no-project:  {target: local-reader, graph: company, query: decisions_without_project}
  lint-no-source:   {target: local-reader, graph: company, query: claims_without_source}
  lint-no-speaker:  {target: local-reader, graph: company, query: claims_without_speaker}
  lint-unowned:     {target: local-reader, graph: company, query: unowned_actions}
  lint-no-claim:    {target: local-reader, graph: company, query: unsupported_actions}
  lint-agent-owner: {target: local-reader, graph: company, query: agents_without_owner}

# ── Mutations (served stored mutations; NOT aliasable) ───────────────────────
# The target's token determines authorization and commit attribution. Agents
# record claims and propose on a branch; a person reviews and merges it, then
# verifies and accepts on main. Examples:
#   omnigraph mutate record_claim --target local-agent --graph company --branch agent/notes-oct-14 --params \
#     '{"slug":"chen-books-recert","kind":"commitment","statement":"Chen books the provider recertification by Oct 21.","quote":"Chen, can you book the recert slot by next Wednesday?","locator":"00:11:20","recorded_at":"2026-10-14T16:00:00.000Z","source":"meet:checkout-sync-2026-10-14","speaker":"alice"}'
#   omnigraph mutate add_action_item --target local-agent --graph company --branch agent/notes-oct-14 --params \
#     '{"slug":"provider-recert","title":"Book the provider recertification","due":"2026-10-21","recorded_at":"2026-10-14T16:00:00.000Z","owner":"chen","claim":"chen-books-recert","project":"checkout"}'
#   omnigraph mutate accept_decision --target local-writer --graph company \
#     --params '{"slug":"checkout-launch-nov-20"}'
#   omnigraph mutate add_person --target local-writer --graph company --params \
#     '{"slug":"gus","name":"Gus Lee","title":"Support agent","email":"gus@lanternworks.example","slack":"u09guest","github":null}'
#   omnigraph mutate end_membership --target local-writer --graph company --params \
#     '{"person":"chen","team":"payments","since":"2026-07-01","until":"2026-12-31"}'
