# code-graph deployment, declared as code (omnigraph cluster model).
#
# Filesystem-backed cluster; storage defaults to this directory.
# Follow ../docs/local-setup.md for bootstrap and writer-lock handoff.
# Later configuration updates go through cluster plan/apply --target local.
version: 1

metadata:
  name: code-graph

state:
  backend: cluster
  lock: true

graphs:
  code:
    schema: schema.pg
    queries: queries/        # registers every `query <name>` in queries/*.gq as a stored query

policies:
  graph-access:
    file: policies/graph.policy.yaml
    applies_to: [code]
  cluster-access:
    file: policies/server.policy.yaml
    applies_to: [cluster]
