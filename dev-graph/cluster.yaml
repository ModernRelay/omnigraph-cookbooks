# dev-graph deployment, declared as code (omnigraph cluster model).
#
# Filesystem-backed cluster; storage defaults to this directory.
# Follow ../README.md#local-setup for bootstrap and writer-lock handoff.
# Later configuration updates go through cluster plan/apply --server.
version: 1

metadata:
  name: dev-graph

state:
  backend: cluster
  lock: true

graphs:
  dev:
    schema: schema.pg
    queries: queries/        # registers every `query <name>` in queries/*.gq as a stored query
    # embedding_provider: default   # uncomment WITH the `providers:` block below to enable semantic search

# Optional query-time embeddings. Supply GEMINI_API_KEY in the server
# environment, uncomment both the provider below and the graph binding above,
# then plan/apply through the running server. Generate stored vectors with
# the offline omnigraph embed pipeline and load the resulting JSONL;
# load never generates @embed fields. See README.md#semantic-search-optional.
#
# providers:
#   embedding:
#     default:
#       kind: gemini
#       base_url: https://generativelanguage.googleapis.com/v1beta
#       model: gemini-embedding-2
#       api_key: ${GEMINI_API_KEY}

policies:
  graph-access:
    file: policies/graph.policy.yaml
    applies_to: [dev]
  cluster-access:
    file: policies/server.policy.yaml
    applies_to: [cluster]
