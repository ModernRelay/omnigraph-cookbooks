# Read aliases for the dev-graph cookbook (graph `dev`).
# Merge the `aliases:` entries below into $OMNIGRAPH_HOME/config.yaml, the operator
# config from ../README.md#local-setup, whose `local-reader` target they use.
# Run one with `omnigraph alias <name>`; pass a query's parameters by name with
# `--params '{"slug":"..."}'`. Aliases only read; run stored mutations with
# `omnigraph mutate <name> --target local-writer --graph dev --params '{...}'`.
aliases:
  # ── Lookups ──────────────────────────────────────────────────
  issue: {target: local-reader, graph: dev, query: issue_lookup}   # --params '{"slug":"..."}'
  epic:  {target: local-reader, graph: dev, query: epic_lookup}    # --params '{"slug":"..."}'
  pr:    {target: local-reader, graph: dev, query: pr_lookup}      # --params '{"slug":"..."}'

  # ── Work state (beads-style, derived) ────────────────────────
  ready:            {target: local-reader, graph: dev, query: ready}
  blocked:          {target: local-reader, graph: dev, query: blocked}
  blocked-parent:   {target: local-reader, graph: dev, query: blocked_by_parent}
  blocked-epic:     {target: local-reader, graph: dev, query: blocked_by_epic}
  blocked-gate:     {target: local-reader, graph: dev, query: blocked_by_gate}
  blocked-wait:     {target: local-reader, graph: dev, query: blocked_by_wait}
  blocked-upstream: {target: local-reader, graph: dev, query: blocked_on_upstream}
  stale:            {target: local-reader, graph: dev, query: stale_candidates}

  # ── Epics ────────────────────────────────────────────────────
  epic-issues: {target: local-reader, graph: dev, query: epic_issues}        # --params '{"epic":"..."}'
  epic-open:   {target: local-reader, graph: dev, query: epic_open_issues}   # --params '{"epic":"..."}'

  # ── Code / release ───────────────────────────────────────────
  release-prs: {target: local-reader, graph: dev, query: release_prs}             # --params '{"release":"..."}'
  issue-prs:   {target: local-reader, graph: dev, query: issue_implementations}   # --params '{"issue":"..."}'
  prs-comp:    {target: local-reader, graph: dev, query: prs_for_component}       # --params '{"component":"..."}'
  issues-comp: {target: local-reader, graph: dev, query: issues_for_component}    # --params '{"component":"..."}'

  # ── Operations ───────────────────────────────────────────────
  incident-cause:     {target: local-reader, graph: dev, query: incident_root_cause}      # --params '{"incident":"..."}'
  incident-blast:     {target: local-reader, graph: dev, query: incident_components}      # --params '{"incident":"..."}'
  learnings-incident: {target: local-reader, graph: dev, query: learnings_for_incident}   # --params '{"incident":"..."}'

  # ── Governance & substrate ───────────────────────────────────
  unheld-invariants: {target: local-reader, graph: dev, query: unheld_invariants}
  gaps:              {target: local-reader, graph: dev, query: gaps_undermining_invariants}
  assumptions:       {target: local-reader, graph: dev, query: assumptions}
  caps-tier:         {target: local-reader, graph: dev, query: capabilities_by_tier}      # --params '{"tier":"..."}'
  decisions-comp:    {target: local-reader, graph: dev, query: decisions_for_component}   # --params '{"component":"..."}'
  no-spec:           {target: local-reader, graph: dev, query: components_without_spec}
  no-cap-impl:       {target: local-reader, graph: dev, query: capabilities_without_component}

  # ── Issue-triage dashboard (queries/issues-dashboard.gq) ─────
  open-epics:      {target: local-reader, graph: dev, query: open_epics}
  epic-counts:     {target: local-reader, graph: dev, query: epic_issue_counts}     # --params '{"epic":"..."}'
  issue-detail:    {target: local-reader, graph: dev, query: issue_detail}          # --params '{"issue":"..."}'
  issue-blockers:  {target: local-reader, graph: dev, query: issue_blockers}        # --params '{"issue":"..."}'
  issue-parents:   {target: local-reader, graph: dev, query: issue_parents}         # --params '{"issue":"..."}'
  issue-epic-parent: {target: local-reader, graph: dev, query: issue_parent_epic}   # --params '{"issue":"..."}'
  issue-gates:     {target: local-reader, graph: dev, query: issue_gates}           # --params '{"issue":"..."}'
  issue-waits-on:  {target: local-reader, graph: dev, query: issue_waits_on}        # --params '{"issue":"..."}'
  issue-comments:  {target: local-reader, graph: dev, query: issue_comments}        # --params '{"issue":"..."}'

  # ── Semantic search (needs an embedding provider + populated embeddings; see README) ──
  sem-issue:     {target: local-reader, graph: dev, query: search_issues}         # --params '{"q":"..."}'
  sem-epic:      {target: local-reader, graph: dev, query: search_epics}          # --params '{"q":"..."}'
  sem-spec:      {target: local-reader, graph: dev, query: search_specs}          # --params '{"q":"..."}'
  sem-decision:  {target: local-reader, graph: dev, query: search_decisions}      # --params '{"q":"..."}'
  sem-learning:  {target: local-reader, graph: dev, query: search_learnings}      # --params '{"q":"..."}'
  sem-invariant: {target: local-reader, graph: dev, query: search_invariants}     # --params '{"q":"..."}'
  sem-principle: {target: local-reader, graph: dev, query: search_principles}     # --params '{"q":"..."}'
  sem-gap:       {target: local-reader, graph: dev, query: search_gaps}           # --params '{"q":"..."}'
  sem-cap:       {target: local-reader, graph: dev, query: search_capabilities}   # --params '{"q":"..."}'
  sem-pr:        {target: local-reader, graph: dev, query: search_prs}            # --params '{"q":"..."}'
  sem-incident:  {target: local-reader, graph: dev, query: search_incidents}      # --params '{"q":"..."}'

# ── Mutations (served stored mutations; NOT aliasable) ───────────────────────
# Run on a branch. The target's token determines authorization and commit attribution.
# The $actor parameter is application provenance stored in rows, not authority. Examples:
#   omnigraph branch create review/x --from main --target local-writer --graph dev
#   omnigraph mutate create_issue --target local-writer --graph dev --branch review/x \
#     --params '{"slug":"iss-new","title":"…","status":"todo","issueType":"task","actor":"act-you","at":"2026-07-09"}'
#   omnigraph mutate update_issue_status --target local-writer --graph dev --branch review/x \
#     --params '{"slug":"iss-new","status":"in_progress","actor":"act-you","at":"2026-07-09"}'
