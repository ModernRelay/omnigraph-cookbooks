version: 1
metadata:
  name: vc-os
state:
  backend: cluster
  lock: true
graphs:
  vcos:
    schema: schema.pg
    queries: queries/

policies:
  graph-access:
    file: policies/graph.policy.yaml
    applies_to: [vcos]
  cluster-access:
    file: policies/server.policy.yaml
    applies_to: [cluster]
