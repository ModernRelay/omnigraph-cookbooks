  pipeline-organizations: {target: local-reader, graph: vcos, query: pipeline_organizations}
  high-fit-pipeline: {target: local-reader, graph: vcos, query: high_fit_pipeline}
  observed-organizations: {target: local-reader, graph: vcos, query: observed_organizations}
  recent-signals: {target: local-reader, graph: vcos, query: recent_signals}
  recent-contradictions: {target: local-reader, graph: vcos, query: recent_contradictions}
  open-questions: {target: local-reader, graph: vcos, query: open_questions}

