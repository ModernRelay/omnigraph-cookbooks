# Read aliases for the VC OS cookbook (graph `vcos`).
# Merge the `aliases:` entries below into $OMNIGRAPH_HOME/config.yaml, the operator
# config from ../README.md#local-setup, whose `local-reader` target they use.
# Run one with `omnigraph alias <name>`; pass a query's parameters by name with
# `--params '{"slug":"..."}'`. Aliases only read; run stored mutations with
# `omnigraph mutate <name> --target local-writer --graph vcos --params '{...}'`.
aliases:
  # ══════════════════════════════════════════════════════════════════
  # VIEW: IC Meeting
  # ══════════════════════════════════════════════════════════════════
  # All pre-ic-brief-* aliases take a *Deal* slug (not an Organization slug).
  # Example: omnigraph alias pre-ic-brief-organization --params '{"slug":"deal-helix-series-a"}'
  pre-ic-brief-organization: {target: local-reader, graph: vcos, query: pre_ic_brief_organization}   # --params '{"slug":"..."}'
  pre-ic-brief-thesis: {target: local-reader, graph: vcos, query: pre_ic_brief_thesis}   # --params '{"slug":"..."}'
  pre-ic-brief-evidence: {target: local-reader, graph: vcos, query: pre_ic_brief_evidence}   # --params '{"slug":"..."}'
  pre-ic-brief-questions: {target: local-reader, graph: vcos, query: pre_ic_brief_questions}   # --params '{"slug":"..."}'
  pre-ic-brief-debate: {target: local-reader, graph: vcos, query: pre_ic_brief_debate}   # --params '{"slug":"..."}'
  pre-ic-meeting-history: {target: local-reader, graph: vcos, query: ic_prep_meeting_history}   # --params '{"slug":"..."}'
  pre-ic-open-commitments: {target: local-reader, graph: vcos, query: ic_prep_open_commitments}   # --params '{"slug":"..."}'
  debate-stances: {target: local-reader, graph: vcos, query: debate_stances}   # --params '{"slug":"..."}'
  founder-card: {target: local-reader, graph: vcos, query: get_person}   # --params '{"slug":"..."}' --format kv
  person-insights: {target: local-reader, graph: vcos, query: person_insights}   # --params '{"slug":"..."}'

