version: 1
metadata:
  name: pharma-intel
state:
  backend: cluster
  lock: true
graphs:
  pharma:
    schema: schema.pg
    queries: queries/

policies:
  graph-access:
    file: policies/graph.policy.yaml
    applies_to: [pharma]
  cluster-access:
    file: policies/server.policy.yaml
    applies_to: [cluster]
