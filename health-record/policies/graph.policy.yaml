# Example roles. Tokens select actors; permissions come from this applied policy.
# The person whose record this is, and anyone they trust with it, run as writers
# and own `main`. An AI agent runs as act-agent: it reads everything, invokes
# stored queries, creates branches and writes only on unprotected branches. It
# cannot write main, merge, publish or delete a branch, so every value an agent
# reads from a document reaches the record through a person's review and merge.
#
# What this policy cannot enforce, and the review before a merge covers instead:
# - Branch ownership. branch_scope knows only protected and unprotected, so an
#   agent can write on any unprotected branch. Every commit records its actor;
#   check them before merging.
# - Which stored query an agent runs. invoke_query covers the whole catalog, so
#   an agent can run mark_reviewed, decide_hypothesis or acknowledge_notification
#   on its own branch. Those are a person's steps; such a commit from act-agent
#   is a reason not to merge.
# - One person from another. A graph that holds a household lets every reader
#   read every person in it. Give each person their own graph to keep them apart.
version: 1
groups:
  readers: [act-admin, act-writer, act-reader, act-agent]
  writers: [act-admin, act-writer]
  agents: [act-agent]
  admins: [act-admin]
protected_branches: [main]
rules:
  - id: read-data
    allow:
      actors: { group: readers }
      actions: [read, export]
      branch_scope: any
  - id: invoke-stored-queries
    allow:
      actors: { group: readers }
      actions: [invoke_query]
  - id: write-data
    allow:
      actors: { group: writers }
      actions: [change]
      branch_scope: any
  - id: manage-branches
    allow:
      actors: { group: writers }
      actions: [branch_create, branch_delete, branch_merge]
      target_branch_scope: any
  - id: agents-write-on-branches
    allow:
      actors: { group: agents }
      actions: [change]
      branch_scope: unprotected
  - id: agents-open-branches
    allow:
      actors: { group: agents }
      actions: [branch_create]
      target_branch_scope: unprotected
  - id: change-schema
    allow:
      actors: { group: admins }
      actions: [schema_apply]
