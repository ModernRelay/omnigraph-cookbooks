# health-record deployment, declared as code (omnigraph cluster model).
#
# Filesystem-backed cluster; storage defaults to this directory.
# Follow ../docs/local-setup.md for bootstrap and writer-lock handoff.
# Later configuration updates go through cluster plan/apply --target <server target>.
#
# No embedding provider is configured: the schema has no vector fields, so no
# health text is sent to a provider.
version: 1

metadata:
  name: health-record

state:
  backend: cluster
  lock: true

graphs:
  health:
    schema: schema.pg
    queries: queries/        # registers every `query <name>` in queries/*.gq as a stored query

policies:
  graph-access:
    file: policies/graph.policy.yaml
    applies_to: [health]
  cluster-access:
    file: policies/server.policy.yaml
    applies_to: [cluster]
