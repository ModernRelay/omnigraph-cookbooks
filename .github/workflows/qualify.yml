name: Cookbook qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The OmniGraph release every journey is qualified against.
  OMNIGRAPH_VERSION: v0.14.0

jobs:
  cookbooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # Not the runner's default: ubuntu-24.04 ships 3.12, which does not verify X.509 strictly,
      # so it would not catch a gateway certificate a current Python refuses.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the pinned release
        shell: bash
        run: |
          set -euo pipefail
          version="$OMNIGRAPH_VERSION"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          asset=omnigraph-linux-x86_64
          archive=$(mktemp -d)
          base="https://github.com/ModernRelay/omnigraph/releases/download/$version"
          curl -fsSL "$base/$asset.tar.gz" -o "$archive/$asset.tar.gz"
          curl -fsSL "$base/$asset.sha256" -o "$archive/$asset.sha256"
          (cd "$archive" && sha256sum -c "$asset.sha256")
          mkdir -p "$RUNNER_TEMP/omnigraph-bin"
          tar -xzf "$archive/$asset.tar.gz" -C "$RUNNER_TEMP/omnigraph-bin" omnigraph omnigraph-server
          echo "$RUNNER_TEMP/omnigraph-bin" >> "$GITHUB_PATH"
      - name: Qualify all local journeys
        run: python3 scripts/check-cookbooks.py
      - name: Test the beads client end to end
        run: python3 -m unittest discover -s beads/client/tests -v
