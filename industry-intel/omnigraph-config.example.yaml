# Read aliases for the Industry Intel (SPIKE) cookbook (graph `spike`).
# Merge the `aliases:` entries below into $OMNIGRAPH_HOME/config.yaml, the operator
# config from ../README.md#local-setup, whose `local-reader` target they use.
# Run one with `omnigraph alias <name>`; pass a query's parameters by name with
# `--params '{"slug":"..."}'`. Aliases only read; run stored mutations with
# `omnigraph mutate <name> --target local-writer --graph spike --params '{...}'`.
aliases:
  # Signals
  signal: {target: local-reader, graph: spike, query: get_signal}   # --params '{"slug":"..."}'
  signals: {target: local-reader, graph: spike, query: recent_signals}
  signal-patterns: {target: local-reader, graph: spike, query: signal_patterns}   # --params '{"slug":"..."}'
  signal-elements: {target: local-reader, graph: spike, query: signal_elements}   # --params '{"slug":"..."}'

  # Patterns
  pattern: {target: local-reader, graph: spike, query: get_pattern}   # --params '{"slug":"..."}'
  patterns: {target: local-reader, graph: spike, query: patterns_by_kind}   # --params '{"kind":"..."}'
  pattern-signals: {target: local-reader, graph: spike, query: pattern_signals}   # --params '{"slug":"..."}'
  pattern-elements: {target: local-reader, graph: spike, query: pattern_elements}   # --params '{"slug":"..."}'

  # Elements
  element: {target: local-reader, graph: spike, query: get_element}   # --params '{"slug":"..."}'
  elements: {target: local-reader, graph: spike, query: elements_by_kind}   # --params '{"kind":"..."}'
  element-signals: {target: local-reader, graph: spike, query: element_signals}   # --params '{"slug":"..."}'
  element-patterns: {target: local-reader, graph: spike, query: element_patterns}   # --params '{"slug":"..."}'

  # Insights
  insight: {target: local-reader, graph: spike, query: get_insight}   # --params '{"slug":"..."}'
  insight-patterns: {target: local-reader, graph: spike, query: insight_patterns}   # --params '{"slug":"..."}'
  insight-elements: {target: local-reader, graph: spike, query: insight_elements}   # --params '{"slug":"..."}'

  # KnowHow
  knowhow: {target: local-reader, graph: spike, query: get_knowhow}   # --params '{"slug":"..."}'
  knowhows: {target: local-reader, graph: spike, query: recent_knowhow}
  knowhow-elements: {target: local-reader, graph: spike, query: knowhow_elements}   # --params '{"slug":"..."}'

  # ── Weekly review (operating loop — see README) ──
  triage: {target: local-reader, graph: spike, query: orphan_signals}
  momentum: {target: local-reader, graph: spike, query: pattern_momentum}   # --params '{"since":"..."}'
  stale: {target: local-reader, graph: spike, query: stale_patterns}   # --params '{"since":"..."}'
  contested: {target: local-reader, graph: spike, query: contested_patterns}
  unsourced: {target: local-reader, graph: spike, query: unsourced_signals}

  # ── Hybrid retrieval (requires embeddings — see README) ──
  related: {target: local-reader, graph: spike, query: related_chunks}   # --params '{"q":"..."}'
  hybrid-search: {target: local-reader, graph: spike, query: hybrid_chunks}   # --params '{"q":"..."}'

# ── Mutations (served stored mutations in queries/mutations.gq; NOT aliasable) ──
#   omnigraph mutate add_signal --target local-writer --graph spike --params '{"slug":"sig-new","name":"…","brief":"…",
#     "stagingTimestamp":"2026-09-14T00:00:00Z","createdAt":"2026-09-14T00:00:00Z","updatedAt":"2026-09-14T00:00:00Z"}'
#   omnigraph mutate link_signal_forms_pattern --target local-writer --graph spike --params '{"signal":"sig-new","pattern":"pat-sovereign-ai"}'
