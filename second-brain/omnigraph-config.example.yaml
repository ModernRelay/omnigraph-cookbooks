  notes-recent: {target: local-reader, graph: brain, query: notes_recent}
  notes-by-kind: {target: local-reader, graph: brain, query: notes_by_kind}   # --params '{"kind":"..."}'
  note-related: {target: local-reader, graph: brain, query: note_related}   # --params '{"slug":"..."}'
  preferences-for-person: {target: local-reader, graph: brain, query: preferences_for_person}   # --params '{"slug":"..."}'
