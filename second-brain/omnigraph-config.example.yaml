  media-recommended-by: {target: local-reader, graph: brain, query: media_recommended_by}   # --params '{"slug":"..."}'
  media-authored-by: {target: local-reader, graph: brain, query: media_authored_by}   # --params '{"slug":"..."}'

  # ── Artifacts ──
