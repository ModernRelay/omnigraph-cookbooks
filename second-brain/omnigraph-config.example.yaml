# Read aliases for the Second Brain cookbook (graph `brain`).
# Merge the `aliases:` entries below into $OMNIGRAPH_HOME/config.yaml, the operator
# config from ../README.md#local-setup, whose `local-reader` target they use.
# Run one with `omnigraph alias <name>`; pass a query's parameters by name with
# `--params '{"slug":"..."}'`. Aliases only read; run stored mutations with
# `omnigraph mutate <name> --target local-writer --graph brain --params '{...}'`.
aliases:
  # ── People & Relationships ──
  person: {target: local-reader, graph: brain, query: get_person}   # --params '{"slug":"..."}'
  people: {target: local-reader, graph: brain, query: people_all}
  people-by-relation: {target: local-reader, graph: brain, query: people_by_relation}   # --params '{"relation":"..."}'
  close-friends: {target: local-reader, graph: brain, query: close_friends}
  family: {target: local-reader, graph: brain, query: family_members}
  person-knows: {target: local-reader, graph: brain, query: person_knows}   # --params '{"slug":"..."}'
  person-family: {target: local-reader, graph: brain, query: person_family}   # --params '{"slug":"..."}'
  person-lives-in: {target: local-reader, graph: brain, query: person_lives_in}   # --params '{"slug":"..."}'
  person-works-at: {target: local-reader, graph: brain, query: person_works_at}   # --params '{"slug":"..."}'
  person-recent-events: {target: local-reader, graph: brain, query: person_recent_events}   # --params '{"slug":"..."}'
  person-artifacts-mentioning: {target: local-reader, graph: brain, query: person_artifacts_mentioning}   # --params '{"slug":"..."}'
  person-artifacts-from: {target: local-reader, graph: brain, query: person_artifacts_from}   # --params '{"slug":"..."}'
  person-tasks-i-owe: {target: local-reader, graph: brain, query: person_tasks_i_owe}   # --params '{"slug":"..."}'
  person-tasks-they-owe: {target: local-reader, graph: brain, query: person_tasks_they_owe}   # --params '{"slug":"..."}'
  person-notes: {target: local-reader, graph: brain, query: person_notes}   # --params '{"slug":"..."}'
  person-recommendations: {target: local-reader, graph: brain, query: person_recommended_media}   # --params '{"slug":"..."}'

  # ── Events ──
  event: {target: local-reader, graph: brain, query: get_event}   # --params '{"slug":"..."}'
  events-recent: {target: local-reader, graph: brain, query: events_recent}
  events-chronological: {target: local-reader, graph: brain, query: events_chronological}
