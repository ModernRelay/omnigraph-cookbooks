# ── Mutations (served stored mutations in queries/mutations.gq; NOT aliasable) ──
#   omnigraph mutate add_person --target local-writer --graph brain --params '{"slug":"per-new","name":"…","relation":"close-friend",
#     "createdAt":"2026-09-14T00:00:00Z","updatedAt":"2026-09-14T00:00:00Z"}'
#   omnigraph mutate link_task_for_person --target local-writer --graph brain --params '{"task":"tk-x","person":"per-theo"}'
