version: 1
metadata:
  name: second-brain
state:
  backend: cluster
  lock: true
graphs:
  brain:
    schema: schema.pg
    queries: queries/

policies:
  graph-access:
    file: policies/graph.policy.yaml
    applies_to: [brain]
  cluster-access:
    file: policies/server.policy.yaml
    applies_to: [cluster]
