# Tokens select actors; permissions come from this applied policy.
#
# Two kinds of agent, kept apart because their writes are of two kinds.
#
# act-executor runs workflows. Its writes are operational state: starting a
# run claims an occurrence, and the next dispatcher must see that claim on
# main at once, so it writes main. It cannot merge or delete branches.
#
# act-agent judges runs and proposes revisions. What it writes is a judgment
# or a change to how agents work, so it writes only on unprotected branches
# and cannot merge or delete one. A person reads the branch, activates or
# rejects each proposed revision there, and merges it.
#
# What this policy cannot enforce, and the review step covers instead:
# - Which types act-executor writes. change covers the whole graph, so an
#   executor could edit a workflow or activate a revision on main. Every
#   commit records its actor; workflow and revision changes by act-executor
#   are a defect to look for.
# - Which stored query act-agent runs on its branch. invoke_query covers the
#   whole catalog, so an agent could run activate_revision there. An agent
#   only proposes, cites and evaluates; an activation in an agent's commit is
#   a reason not to merge.
#
# act-admin, act-writer and act-reader are the roles every cookbook ships.
version: 1
groups:
  readers: [act-admin, act-writer, act-reader, act-executor, act-agent]
  writers: [act-admin, act-writer]
  admins: [act-admin]
  executors: [act-executor]
  agents: [act-agent]
protected_branches: [main]
rules:
  - id: read-data
    allow:
      actors: { group: readers }
      actions: [read, export]
      branch_scope: any
  - id: invoke-stored-queries
    allow:
      actors: { group: readers }
      actions: [invoke_query]
  - id: write-data
    allow:
      actors: { group: writers }
      actions: [change]
      branch_scope: any
  - id: manage-branches
    allow:
      actors: { group: writers }
      actions: [branch_create, branch_delete, branch_merge]
      target_branch_scope: any
  - id: executors-write-runs
    allow:
      actors: { group: executors }
      actions: [change]
      branch_scope: any
  - id: agents-write-on-branches
    allow:
      actors: { group: agents }
      actions: [change]
      branch_scope: unprotected
  - id: agents-open-branches
    allow:
      actors: { group: agents }
      actions: [branch_create]
      target_branch_scope: unprotected
  - id: change-schema
    allow:
      actors: { group: admins }
      actions: [schema_apply]
